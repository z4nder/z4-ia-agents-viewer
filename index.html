<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/logo.svg" />
        <title>Sessões de agentes</title>
        <script>
            // Applies the theme before React loads, so a dark page doesn't flash white.
            try {
                const stored = localStorage.getItem('z4-viewer-theme');
                const isDark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.classList.toggle('dark', isDark);
                document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
            } catch {}
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/app.tsx"></script>
    </body>
</html>
